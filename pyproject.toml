[project]
name = "brief-digest"
version = "0.0.0"
description = "Local tool that converts court filings (PDF) to text and drafts structured summaries with a local LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
brief-digest = "brief_digest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "reportlab>=4",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "PTH", "SIM", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
# Explicit, developer-run setup download (hard rule 5); never imported by the app.
"scripts/fetch_tessdata.py" = ["TID251", "S310"]
# Developer report printed to the console; synthetic documents only.
"scripts/eval_models.py" = ["T20"]
# Developer-run setup: console output, and launchctl called by absolute path.
"scripts/install.py" = ["T20"]
# The one runtime module allowed network access: loopback Ollama only (hard rule 5).
"src/brief_digest/ollama.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "No network clients (rule 5). Only the Ollama module may talk to loopback."
"httpx".msg = "No network clients (rule 5). Only the Ollama module may talk to loopback."
"aiohttp".msg = "No network clients (rule 5)."
"urllib.request".msg = "No network clients (rule 5)."
"http.client".msg = "No network clients (rule 5)."
"socket".msg = "No raw sockets (rule 5)."

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = ["ollama: needs a local Ollama server and model; opt-in via BRIEF_DIGEST_OLLAMA_MODEL"]
